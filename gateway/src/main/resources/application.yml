server:
  port: 8080

spring:
  application:
    name: gateway

  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.99.100:8848
        username: nacos
        password: nacos

    # Gateway 路由配置
    gateway:
      routes:
        # auth-server 路由
        - id: auth-server
          uri: lb://auth-server
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        # resource-api 路由
        - id: resource-api
          uri: lb://resource-api
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1

      # 默认过滤器
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

  # OAuth2 Client 配置
  security:
    oauth2:
      client:
        registration:
          gateway-client:
            client-id: gateway-app
            client-secret: gateway-secret
            scope: openid,profile,email
            authorization-grant-type: authorization_code
#            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            redirect-uri: "http://gateway.local:8082/login/oauth2/code/auth-server"
            client-name: Gateway Client
        provider:
          gateway-client:
            issuer-uri: http://auth.local:9000
            authorization-uri: http://auth.local:9000/oauth2/authorize
            token-uri: http://auth.local:9000/oauth2/token
            user-info-uri: http://auth.local:9000/userinfo
            user-name-attribute: sub

  # Session 配置 (Redis)
  session:
    store-type: redis
    timeout: 30m

  # Redis 配置
  data:
    redis:
      host: 192.168.99.100
      port: 6379
      database: 12
      password: 123456

# 日志配置
logging:
  level:
    com.example.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
