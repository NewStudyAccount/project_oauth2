<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client-B - 用户资料</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 40px; max-width: 600px; width: 100%; }
        h1 { text-align: center; color: #333; margin-bottom: 8px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .info-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
        .label { color: #666; font-size: 14px; }
        .value { color: #333; font-weight: 500; font-size: 14px; word-break: break-all; max-width: 60%; text-align: right; }
        .token-section { margin: 24px 0; }
        .token-section h3 { color: #333; margin-bottom: 8px; }
        .token-box { width: 100%; height: 120px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: monospace; font-size: 12px; resize: vertical; background: #f8f9fa; }
        .btn { display: block; text-align: center; padding: 12px 24px; background: linear-gradient(135deg, #f093fb, #f5576c); color: white; border-radius: 8px; text-decoration: none; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>👤 用户资料</h1>
        <p class="subtitle">Client-B (Spring Boot OAuth2 Client)</p>

        <div class="info-item">
            <span class="label">用户名</span>
            <span class="value" th:text="${username}">-</span>
        </div>
        <div class="info-item">
            <span class="label">姓名</span>
            <span class="value" th:text="${name}">-</span>
        </div>
        <div class="info-item">
            <span class="label">邮箱</span>
            <span class="value" th:text="${email}">-</span>
        </div>
        <div class="info-item">
            <span class="label">Subject (sub)</span>
            <span class="value" th:text="${sub}">-</span>
        </div>
        <div class="info-item">
            <span class="label">签发者 (iss)</span>
            <span class="value" th:text="${issuer}">-</span>
        </div>

        <div class="token-section">
            <h3>Access Token</h3>
            <textarea readonly class="token-box" th:text="${accessToken}"></textarea>
        </div>

        <a th:href="@{/}" class="btn">返回首页</a>
    </div>
</body>
</html>
