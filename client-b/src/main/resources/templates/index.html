<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client-B - OAuth2 SSO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 40px; max-width: 500px; width: 100%; text-align: center; }
        h1 { color: #333; margin-bottom: 8px; }
        .subtitle { color: #666; margin-bottom: 30px; }
        .user-info { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 24px; }
        .avatar { width: 48px; height: 48px; background: linear-gradient(135deg, #f093fb, #f5576c); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
        .name { font-weight: 600; color: #333; }
        .email { color: #666; font-size: 14px; }
        .actions { display: flex; gap: 12px; justify-content: center; }
        .btn { padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; border: none; display: inline-block; }
        .btn-primary { background: linear-gradient(135deg, #f093fb, #f5576c); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .not-logged-in p { color: #666; margin-bottom: 20px; }
        .info-card { margin-top: 24px; background: #f8f9fa; border-radius: 8px; padding: 20px; }
        .info-card h3 { color: #333; margin-bottom: 8px; }
        .info-card p { color: #666; font-size: 14px; }
        .info-card a { color: #f093fb; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Client-B</h1>
        <p class="subtitle">Spring Boot OAuth2 客户端</p>

        <div th:if="${loggedIn}">
            <div class="user-info">
                <span class="avatar" th:text="${#strings.substring(username, 0, 1)}"></span>
                <div>
                    <p class="name" th:text="${username}"></p>
                    <p class="email" th:text="${email}"></p>
                </div>
            </div>
            <div class="actions">
                <a th:href="@{/profile}" class="btn btn-primary">查看资料</a>
                <form th:action="@{/logout}" method="post" style="display:inline">
                    <button type="submit" class="btn btn-secondary">退出登录</button>
                </form>
            </div>
        </div>

        <div th:unless="${loggedIn}">
            <p>您尚未登录</p>
            <div class="actions">
                <a th:href="@{/oauth2/authorization/client-b}" class="btn btn-primary">登录</a>
            </div>
        </div>

        <div class="info-card">
            <h3>SSO 演示</h3>
            <p>如果已在 <a href="http://app-a.local:5173" target="_blank">app-a.local</a> 登录，这里会自动登录！</p>
        </div>
    </div>
</body>
</html>
