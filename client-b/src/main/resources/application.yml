server:
  port: 8082

spring:
  application:
    name: client-b
  security:
    oauth2:
      client:
        registration:
          client-b:
            client-id: client-b
            client-secret: client-b-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          auth-server:
            authorization-uri: http://auth.local:9000/oauth2/authorize
            token-uri: http://auth.local:9000/oauth2/token
            jwk-set-uri: http://auth.local:9000/oauth2/jwks
            user-info-uri: http://auth.local:9000/userinfo
            user-name-attribute: sub
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
