<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人中心</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { background: #f5f5f5; padding: 24px; border-radius: 8px; }
        .row { display: flex; padding: 12px 0; border-bottom: 1px solid #ddd; }
        .label { width: 120px; color: #666; }
        .btn { padding: 8px 16px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <h1>个人中心</h1>
    <div class="card">
        <div th:each="entry : ${user}" class="row">
            <span class="label" th:text="${entry.key}">key</span>
            <span th:text="${entry.value}">value</span>
        </div>
    </div>
    <a href="/" class="btn" style="margin-top: 16px;">返回首页</a>
</body>
</html>
