server:
  port: 8082

spring:
  application:
    name: app-springboot

  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.99.100:8848
        username: nacos
        password: nacos

  # OAuth2 Resource Server 配置 (验证 Gateway 转发的 Token)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.local:9000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

logging:
  level:
    com.example.appspringboot: DEBUG
    org.springframework.security: DEBUG
