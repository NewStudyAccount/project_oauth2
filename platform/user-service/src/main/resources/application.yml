server:
  port: 8081

spring:
  application:
    name: user-service

  # ==================== 数据源配置（独立数据库 user_center） ====================
  datasource:
    url: jdbc:mysql://192.168.99.100:3306/user_center?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# ==================== 日志配置 ====================
logging:
  level:
    com.example.userservice: DEBUG
