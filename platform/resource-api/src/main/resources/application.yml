server:
  port: 8083

spring:
  application:
    name: resource-api

  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.99.100:8848
        username: nacos
        password: nacos

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.local:9000
          jwk-set-uri: http://auth.local:9000/oauth2/jwks
