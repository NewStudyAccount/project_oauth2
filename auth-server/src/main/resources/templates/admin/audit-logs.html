<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审计日志 - 管理后台</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="navbar">
    <h1><a th:href="@{/admin}" style="color:white;text-decoration:none;">统一认证中心 - 管理后台</a></h1>
    <div class="nav-user">
        <span sec:authentication="name">admin</span>
        &nbsp;|&nbsp;
        <a th:href="@{/}" style="color:white;">首页</a>
        &nbsp;|&nbsp;
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" style="background:none;border:none;color:white;cursor:pointer;font-size:14px;">登出</button>
        </form>
    </div>
</div>

<div class="sidebar">
    <a th:href="@{/admin}" class="menu-item">系统概览</a>
    <a th:href="@{/admin/users}" class="menu-item">用户管理</a>
    <a th:href="@{/admin/clients}" class="menu-item">客户端管理</a>
    <a th:href="@{/admin/access}" class="menu-item">权限管理</a>
    <a th:href="@{/admin/audit-logs}" class="menu-item active">审计日志</a>
    <a th:href="@{/admin/tokens}" class="menu-item">Token 管理</a>
</div>

<div class="main-content">

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="page-header">
        <h2>审计日志</h2>
    </div>

    <div class="card">
        <form th:action="@{/admin/audit-logs}" method="get" class="filter-bar">
            <select name="action">
                <option value="">全部操作类型</option>
                <option value="LOGIN" th:selected="${actionFilter == 'LOGIN'}">LOGIN</option>
                <option value="LOGOUT" th:selected="${actionFilter == 'LOGOUT'}">LOGOUT</option>
                <option value="AUTHORIZE" th:selected="${actionFilter == 'AUTHORIZE'}">AUTHORIZE</option>
                <option value="TOKEN_ISSUED" th:selected="${actionFilter == 'TOKEN_ISSUED'}">TOKEN_ISSUED</option>
                <option value="TOKEN_REVOKED" th:selected="${actionFilter == 'TOKEN_REVOKED'}">TOKEN_REVOKED</option>
                <option value="REGISTER" th:selected="${actionFilter == 'REGISTER'}">REGISTER</option>
            </select>
            <input type="text" name="username" th:value="${usernameFilter}" placeholder="用户名">
            <button type="submit" class="btn btn-primary btn-sm">筛选</button>
            <a th:href="@{/admin/audit-logs}" class="btn btn-sm" style="background:#f3f4f6;color:#374151;">重置</a>
        </form>
    </div>

    <div class="card">
        <table class="data-table">
            <thead>
            <tr>
                <th>时间</th>
                <th>用户</th>
                <th>操作</th>
                <th>详情</th>
                <th>IP</th>
                <th>状态</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="log : ${logs}">
                <td th:text="${log.createdAt}"></td>
                <td th:text="${log.username}"></td>
                <td>
                    <span class="badge badge-info" th:text="${log.action}"></span>
                </td>
                <td th:text="${log.detail}"></td>
                <td th:text="${log.ip}"></td>
                <td>
                    <span th:if="${log.status == 'SUCCESS'}" class="badge badge-success">成功</span>
                    <span th:if="${log.status == 'FAILED'}" class="badge badge-danger">失败</span>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:if="${#lists.isEmpty(logs)}" class="empty-state">暂无审计日志</div>
    </div>

</div>

</body>
</html>
