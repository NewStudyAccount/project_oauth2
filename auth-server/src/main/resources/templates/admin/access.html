<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>权限管理 - 管理后台</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="navbar">
    <h1><a th:href="@{/admin}" style="color:white;text-decoration:none;">统一认证中心 - 管理后台</a></h1>
    <div class="nav-user">
        <span sec:authentication="name">admin</span>
        &nbsp;|&nbsp;
        <a th:href="@{/}" style="color:white;">首页</a>
        &nbsp;|&nbsp;
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" style="background:none;border:none;color:white;cursor:pointer;font-size:14px;">登出</button>
        </form>
    </div>
</div>

<div class="sidebar">
    <a th:href="@{/admin}" class="menu-item">系统概览</a>
    <a th:href="@{/admin/users}" class="menu-item">用户管理</a>
    <a th:href="@{/admin/clients}" class="menu-item">客户端管理</a>
    <a th:href="@{/admin/access}" class="menu-item active">权限管理</a>
    <a th:href="@{/admin/audit-logs}" class="menu-item">审计日志</a>
    <a th:href="@{/admin/tokens}" class="menu-item">Token 管理</a>
</div>

<div class="main-content">

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="page-header">
        <h2>权限管理</h2>
    </div>

    <!-- 用户选择 -->
    <div class="card">
        <form th:action="@{/admin/access}" method="get" style="display:flex;gap:12px;align-items:center;">
            <label style="font-weight:500;">选择用户：</label>
            <select name="userId" style="padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;min-width:200px;">
                <option value="">-- 请选择 --</option>
                <option th:each="user : ${users}"
                        th:value="${user.id}"
                        th:text="${user.username + ' (' + (user.nickname != null ? user.nickname : '') + ')'}"
                        th:selected="${selectedUserId != null and selectedUserId == user.id}">
                </option>
            </select>
            <button type="submit" class="btn btn-primary">查询</button>
        </form>
    </div>

    <!-- 权限矩阵 -->
    <div th:if="${selectedUser != null}" class="card">
        <h3 style="margin-bottom:16px;">
            用户：<span th:text="${selectedUser.username}"></span>
            <span th:if="${selectedUser.nickname != null}" th:text="' (' + ${selectedUser.nickname} + ')'"></span>
        </h3>

        <table class="data-table">
            <thead>
            <tr>
                <th>客户端 ID</th>
                <th>客户端名称</th>
                <th>类型</th>
                <th>访问权限</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client : ${clients}">
                <td th:text="${client.clientId}"></td>
                <td th:text="${client.clientName}"></td>
                <td>
                    <span th:if="${client.clientType == 'PUBLIC'}" class="badge badge-info">公开</span>
                    <span th:if="${client.clientType == 'CONFIDENTIAL'}" class="badge badge-warning">机密</span>
                </td>
                <td>
                    <span th:with="hasAccess=${accesses != null and accesses.?[clientId == ${client.clientId}].size() > 0 and accesses.?[clientId == ${client.clientId}][0].allowed == 1}">
                        <span th:if="${hasAccess}" class="badge badge-success">允许</span>
                        <span th:if="${!hasAccess}" class="badge badge-danger">未授权</span>
                    </span>
                </td>
                <td>
                    <form th:action="@{/admin/access/save}" method="post" style="display:flex;gap:8px;">
                        <input type="hidden" name="userId" th:value="${selectedUserId}">
                        <input type="hidden" name="clientId" th:value="${client.clientId}">
                        <input type="hidden" name="allowed" value="true">
                        <button type="submit" class="btn btn-success btn-sm">允许</button>
                    </form>
                    <form th:action="@{/admin/access/save}" method="post" style="display:inline;">
                        <input type="hidden" name="userId" th:value="${selectedUserId}">
                        <input type="hidden" name="clientId" th:value="${client.clientId}">
                        <input type="hidden" name="allowed" value="false">
                        <button type="submit" class="btn btn-danger btn-sm">拒绝</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${selectedUser == null}" class="card">
        <div class="empty-state">请先选择一个用户以查看和管理其权限</div>
    </div>

</div>

</body>
</html>
