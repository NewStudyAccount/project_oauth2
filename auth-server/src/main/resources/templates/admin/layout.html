<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 统一认证中心</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<!-- Top Navbar -->
<div class="navbar">
    <h1><a th:href="@{/admin}">统一认证中心 - 管理后台</a></h1>
    <div class="nav-user">
        <span sec:authentication="name">admin</span>
        &nbsp;|&nbsp;
        <a th:href="@{/}">首页</a>
        &nbsp;|&nbsp;
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" style="background:none;border:none;color:white;cursor:pointer;font-size:14px;">登出</button>
        </form>
    </div>
</div>

<!-- Sidebar -->
<div class="sidebar">
    <a th:href="@{/admin}" class="menu-item" th:classappend="${activeMenu == 'index'} ? 'active'">系统概览</a>
    <a th:href="@{/admin/users}" class="menu-item" th:classappend="${activeMenu == 'users'} ? 'active'">用户管理</a>
    <a th:href="@{/admin/clients}" class="menu-item" th:classappend="${activeMenu == 'clients'} ? 'active'">客户端管理</a>
    <a th:href="@{/admin/access}" class="menu-item" th:classappend="${activeMenu == 'access'} ? 'active'">权限管理</a>
    <a th:href="@{/admin/audit-logs}" class="menu-item" th:classappend="${activeMenu == 'audit-logs'} ? 'active'">审计日志</a>
    <a th:href="@{/admin/tokens}" class="menu-item" th:classappend="${activeMenu == 'tokens'} ? 'active'">Token 管理</a>
</div>

<!-- Main Content -->
<div class="main-content">

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <!-- Page content injected by each page -->
    <div th:insert="${pageContent} :: content"></div>

</div>

</body>
</html>
