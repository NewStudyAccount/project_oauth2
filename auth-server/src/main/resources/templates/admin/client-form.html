<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${client.id != null ? '编辑客户端' : '新增客户端'}">客户端表单</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="navbar">
    <h1><a th:href="@{/admin}" style="color:white;text-decoration:none;">统一认证中心 - 管理后台</a></h1>
    <div class="nav-user">
        <span sec:authentication="name">admin</span>
        &nbsp;|&nbsp;
        <a th:href="@{/}" style="color:white;">首页</a>
        &nbsp;|&nbsp;
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" style="background:none;border:none;color:white;cursor:pointer;font-size:14px;">登出</button>
        </form>
    </div>
</div>

<div class="sidebar">
    <a th:href="@{/admin}" class="menu-item">系统概览</a>
    <a th:href="@{/admin/users}" class="menu-item">用户管理</a>
    <a th:href="@{/admin/clients}" class="menu-item active">客户端管理</a>
    <a th:href="@{/admin/access}" class="menu-item">权限管理</a>
    <a th:href="@{/admin/audit-logs}" class="menu-item">审计日志</a>
    <a th:href="@{/admin/tokens}" class="menu-item">Token 管理</a>
</div>

<div class="main-content">

    <div class="page-header">
        <h2 th:text="${client.id != null ? '编辑客户端' : '新增客户端'}">客户端表单</h2>
        <a th:href="@{/admin/clients}" class="btn btn-primary">返回列表</a>
    </div>

    <div class="card" style="max-width:600px;">
        <form th:action="@{/admin/clients/save}" th:object="${client}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label>Client ID</label>
                <input type="text" th:field="*{clientId}" placeholder="例如: my-app" required>
            </div>

            <div class="form-group">
                <label>Client Secret（公开客户端留空）</label>
                <input type="text" th:field="*{clientSecret}" placeholder="机密客户端填写密钥">
            </div>

            <div class="form-group">
                <label>客户端名称</label>
                <input type="text" th:field="*{clientName}" placeholder="显示名称">
            </div>

            <div class="form-group">
                <label>客户端类型</label>
                <select th:field="*{clientType}">
                    <option value="PUBLIC">PUBLIC（公开客户端）</option>
                    <option value="CONFIDENTIAL">CONFIDENTIAL（机密客户端）</option>
                    <option value="INTERNAL">INTERNAL（内部应用）</option>
                    <option value="THIRD_PARTY">THIRD_PARTY（第三方应用）</option>
                </select>
            </div>

            <div class="form-group">
                <label>Scopes（逗号分隔）</label>
                <input type="text" th:field="*{scopes}" placeholder="openid,profile,email">
            </div>

            <div class="form-group">
                <label>授权类型（逗号分隔）</label>
                <input type="text" th:field="*{grantTypes}" placeholder="authorization_code,refresh_token">
            </div>

            <div class="form-group">
                <label>重定向 URI（逗号分隔）</label>
                <input type="text" th:field="*{redirectUris}" placeholder="http://localhost:5173/callback">
            </div>

            <div class="form-group">
                <label>Access Token 有效期（秒）</label>
                <input type="number" th:field="*{accessTokenTtl}" placeholder="1800">
            </div>

            <div class="form-group">
                <label>Refresh Token 有效期（秒）</label>
                <input type="number" th:field="*{refreshTokenTtl}" placeholder="604800">
            </div>

            <div class="form-group">
                <label>需要用户授权确认</label>
                <select th:field="*{requireConsent}">
                    <option value="0">否（内部应用自动授权）</option>
                    <option value="1">是（第三方应用需确认）</option>
                </select>
            </div>

            <div class="form-group">
                <label>状态</label>
                <select th:field="*{status}">
                    <option value="1">正常</option>
                    <option value="0">禁用</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;">保存</button>
        </form>
    </div>

</div>

</body>
</html>
