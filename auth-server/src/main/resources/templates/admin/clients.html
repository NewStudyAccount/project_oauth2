<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户端管理 - 管理后台</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="navbar">
    <h1><a th:href="@{/admin}" style="color:white;text-decoration:none;">统一认证中心 - 管理后台</a></h1>
    <div class="nav-user">
        <span sec:authentication="name">admin</span>
        &nbsp;|&nbsp;
        <a th:href="@{/}" style="color:white;">首页</a>
        &nbsp;|&nbsp;
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit" style="background:none;border:none;color:white;cursor:pointer;font-size:14px;">登出</button>
        </form>
    </div>
</div>

<div class="sidebar">
    <a th:href="@{/admin}" class="menu-item">系统概览</a>
    <a th:href="@{/admin/users}" class="menu-item">用户管理</a>
    <a th:href="@{/admin/clients}" class="menu-item active">客户端管理</a>
    <a th:href="@{/admin/access}" class="menu-item">权限管理</a>
    <a th:href="@{/admin/audit-logs}" class="menu-item">审计日志</a>
    <a th:href="@{/admin/tokens}" class="menu-item">Token 管理</a>
</div>

<div class="main-content">

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="page-header">
        <h2>客户端管理</h2>
        <a th:href="@{/admin/clients/add}" class="btn btn-primary">新增客户端</a>
    </div>

    <div class="card">
        <table class="data-table">
            <thead>
            <tr>
                <th>Client ID</th>
                <th>名称</th>
                <th>类型</th>
                <th>Scopes</th>
                <th>授权类型</th>
                <th>需要授权确认</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="client : ${clients}">
                <td th:text="${client.clientId}"></td>
                <td th:text="${client.clientName}"></td>
                <td>
                    <span th:if="${client.clientType == 'PUBLIC'}" class="badge badge-info">公开</span>
                    <span th:if="${client.clientType == 'CONFIDENTIAL'}" class="badge badge-warning">机密</span>
                    <span th:if="${client.clientType != 'PUBLIC' and client.clientType != 'CONFIDENTIAL'}" th:text="${client.clientType}"></span>
                </td>
                <td th:text="${client.scopes}"></td>
                <td th:text="${client.grantTypes}"></td>
                <td>
                    <span th:if="${client.requireConsent == 1}" class="badge badge-warning">是</span>
                    <span th:if="${client.requireConsent == 0}" class="badge badge-success">否</span>
                </td>
                <td>
                    <span th:if="${client.status == 1}" class="badge badge-success">正常</span>
                    <span th:if="${client.status == 0}" class="badge badge-danger">禁用</span>
                </td>
                <td>
                    <a th:href="@{/admin/clients/{id}/edit(id=${client.id})}" class="btn btn-primary btn-sm">编辑</a>
                    <form th:action="@{/admin/clients/{id}/delete(id=${client.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('确定要删除该客户端吗？')">删除</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div th:if="${#lists.isEmpty(clients)}" class="empty-state">暂无客户端数据</div>
    </div>

</div>

</body>
</html>
