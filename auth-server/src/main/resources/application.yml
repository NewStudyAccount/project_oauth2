server:
  port: 9000

spring:
  application:
    name: auth-server

  datasource:
    url: jdbc:mysql://192.168.99.100:3306/oauth2_center?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:db/schema.sql
#      data-locations: classpath:db/data.sql

  data:
    redis:
      host: 192.168.99.100
      port: 6379
      database: 12
      password: 123456

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  # OAuth2 客户端配置已迁移至数据库 (oauth2_registered_client 表)
  # 由 JdbcRegisteredClientRepository 加载，不再使用 yml 静态配置

  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-smtp-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.example.authserver: DEBUG
    org.springframework.security: DEBUG
