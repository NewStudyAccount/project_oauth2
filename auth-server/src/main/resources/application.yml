server:
  port: 9000

spring:
  application:
    name: auth-server

  # Nacos 配置
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.99.100:8848
        username: nacos
        password: nacos

  datasource:
    url: jdbc:mysql://192.168.99.100:3306/oauth2_center?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:db/schema.sql
#      data-locations: classpath:db/data.sql

  data:
    redis:
      host: 192.168.99.100
      port: 6379
      database: 12
      password: 123456

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false

  security:
    oauth2:
      authorizationserver:
        client:
          # Vue SPA - 公开客户端 (PKCE)
          vue-app:
            registration:
              client-id: vue-app
              client-authentication-methods:
                - none
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - http://client.a.local:5173/callback
              scopes:
                - openid
                - profile
                - email
            require-authorization-consent: false
          # Spring Boot - 机密客户端
          springboot-app:
            registration:
              client-id: springboot-app
              client-secret: "{noop}Admin@123"
              client-authentication-methods:
                - client_secret_basic
                - client_secret_post
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - http://client.a.local:8082/login/oauth2/code/springboot-app
              scopes:
                - openid
                - profile
                - email
            require-authorization-consent: false
          # Gateway 网关客户端
          gateway-app:
            registration:
              client-id: gateway-app
              client-secret: "{noop}gateway-secret"
              client-authentication-methods:
                - client_secret_basic
                - client_secret_post
              authorization-grant-types:
                - authorization_code
                - refresh_token
              redirect-uris:
                - http://gateway.local:8080/login/oauth2/code/gateway-client
              scopes:
                - openid
                - profile
                - email
            require-authorization-consent: false
          # 第三方应用 - 需要用户确认
          third-party-app:
            registration:
              client-id: third-party-app
              client-secret: "{noop}ThirdParty@123"
              client-authentication-methods:
                - client_secret_basic
              authorization-grant-types:
                - authorization_code
              redirect-uris:
                - http://localhost:8080/callback
              scopes:
                - openid
                - profile
            require-authorization-consent: true

  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-smtp-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.example.authserver: DEBUG
    org.springframework.security: DEBUG
